*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
a{color:var(--felt)}
:focus-visible{outline:2px solid var(--felt);outline-offset:2px}

.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:28px 0 6px}
.note{font-size:13.5px;color:var(--muted);margin:0 0 8px;max-width:75ch}
table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--card)}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--display);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lo{color:var(--t-pass);font-weight:700}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:4px;color:var(--muted)}
.login{max-width:340px}
.login input{display:block;width:100%;box-sizing:border-box;margin:6px 0 0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
button{font-family:var(--display);font-weight:600;font-size:15px;cursor:pointer;border:1px solid var(--felt);background:var(--felt);color:var(--card);border-radius:999px;padding:6px 14px;margin:10px 6px 0 0}
.msg{color:var(--t-pass);font-size:14px}
.flag{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0 0;font-size:14px}
.flag i{color:var(--muted)}
#copyOut textarea{width:100%;min-height:160px;font:12.5px/1.4 ui-monospace,Menlo,monospace}
</style>

<script type="module">
const CONFIG={"apiKey": "AIzaSyBKoS1NrMD5GJZLNIvMw0WzabMxcrkLD3c", "authDomain": "euchre-drill.firebaseapp.com", "projectId": "euchre-drill", "storageBucket": "euchre-drill.firebasestorage.app", "messagingSenderId": "153025716379", "appId": "1:153025716379:web:81af9558c9a143cec8e63e"},V="10.14.1",ITEMS=window.ITEMS,BY=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const SKILLS=[["S1R1","Seat 1 · Round 1"],["S1R2","Seat 1 · Round 2"],["S2","Seat 2"],["S3","Seat 3"],["S4","Dealer"],["Leads","Leads & play"],["Score","Score matters"],["Loners","Loners"],["Next","Calling next"],["TwoSmall","Two small trump"]];

const FT={disagree:"I disagree",question:"I have a question",unclear:"Not clear"};

const pct=(a,b)=>b?Math.round(100*a/b)+"%":"–";
const band=r=>r==null?"No rating":(BANDS.find(b=>r>=b[1]&&r<b[2])||["No rating"])[0];
const qtxt=i=>`${i.seatName.replace(/ \(.*/,"")} ${i.round==="R2"?"R2":"R1"} · ${i.hand.join(" ")} / ${i.upcard}${i.score?` · ${i.score[0]}-${i.score[1]}`:""}`;
const [{initializeApp},A,F]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)]);
const app=initializeApp(CONFIG),auth=A.getAuth(app),db=F.getFirestore(app);
A.onAuthStateChanged(auth,u=>u?show().catch(e=>{$("app").innerHTML=`<p class="msg">${esc(e.code==="permission-denied"?"This page is only for the drill's owner.":e.message)}</p><button id="out">Sign out</button>`;$("out").onclick=()=>A.signOut(auth)}):login());
function login(){
  $("app").innerHTML=`<div class="login"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button id="go">Sign in</button><p class="msg" id="m"></p></div>`;
  $("go").onclick=()=>A.signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value).catch(e=>$("m").textContent="That didn't work: "+e.code);
}
async function all(c){return (await F.getDocs(F.collection(db,c))).docs.map(d=>({id:d.id,...d.data()}))}
async function show(){
  const [users,answers,flags,results]=await Promise.all([all("users"),all("answers"),all("flags"),all("results")]);
  const U=Object.fromEntries(users.map(u=>[u.id,u]));
  answers.sort((a,b)=>(a.at?.seconds||0)-(b.at?.seconds||0));
  // First answer per player per hand: honest agreement, not memorised repeats.
  const first={};for(const a of answers){const k=a.uid+"|"+a.qid;if(!first[k])first[k]=a}
  const F1=Object.values(first);
  const learned=(p,i)=>p&&p.box&&p.box[i.id]&&p.box[i.id].b>=3;
  const players=users.map(u=>{const mine=F1.filter(a=>a.uid===u.id),all_=answers.filter(a=>a.uid===u.id),ex=results.filter(r=>r.uid===u.id&&r.kind==="express"),dl=results.filter(r=>r.uid===u.id&&r.kind==="daily");
    const mastered=SKILLS.filter(([k])=>{const P=ITEMS.filter(i=>i.tags.includes(k));return P.every(i=>learned(u.progress,i))}).length;
    return {u,first:mine.length,agree:mine.filter(a=>a.ok).length,total:all_.length,exBest:ex.length?Math.max(...ex.map(r=>r.score)):null,daily:dl.length,mastered,flags:flags.filter(f=>f.uid===u.id).length}});
  players.sort((a,b)=>b.total-a.total);
  const bandRows=[...BANDS.map(b=>b[0]),"No rating"].map(b=>{const P=players.filter(p=>band(p.u.rating)===b);const f=P.reduce((s,p)=>s+p.first,0),a=P.reduce((s,p)=>s+p.agree,0);return {b,n:P.length,f,a}});
  const qrows=ITEMS.map(i=>{const A1=F1.filter(a=>a.qid===i.id),E=A1.filter(a=>U[a.uid]?.role==="expert");
    const byBand=Object.fromEntries([...BANDS.map(b=>b[0])].map(b=>{const X=A1.filter(a=>band(U[a.uid]?.rating)===b);return [b,[X.filter(a=>a.ok).length,X.length]]}));
    return {i,n:A1.length,ok:A1.filter(a=>a.ok).length,en:E.length,eok:E.filter(a=>a.ok).length,byBand,fl:flags.filter(f=>f.qid===i.id).length}});
  qrows.sort((a,b)=>(a.en?a.eok/a.en:2)-(b.en?b.eok/b.en:2)||(a.n?a.ok/a.n:2)-(b.n?b.ok/b.n:2));

  $("app").innerHTML=`

   <h2>Flags</h2><p class="note">Grouped by type. Comments are the player's own words.</p>
   ${["disagree","question","unclear"].map(t=>{const L=fl.filter(f=>f.type===t);return `<h3>${FT[t]} (${L.length})</h3>${L.map(f=>`<div class="flag"><b>${esc(f.u.username||f.username)}</b>${f.u.role==="expert"?'<span class="tag">expert</span>':""}${f.u.rating?`<span class="tag">${f.u.rating}</span>`:""} · ${esc(qtxt(f.i))} · drill says <b>${esc(f.i.answer)}</b>${f.picked?`, they picked ${esc(f.picked)}`:""}<br>${f.note?`<i>${esc(f.note)}</i>`:'<i>(no comment)</i>'} <span class="tag">${esc(f.qid)}</span></div>`).join("")||'<p class="note">None.</p>'}`}).join("")}
   <button id="copy">Copy all flags for Claude</button><div id="copyOut"></div>
   <h2>By rating</h2><p class="note">Self-reported highest Euchre 3D rating. Small groups: read counts before percentages.</p>
   <table><tr><th>Band</th><th>Players</th><th>First answers</th><th>Agreed with drill</th></tr>${bandRows.map(r=>`<tr><td>${r.b}</td><td class="n">${r.n}</td><td class="n">${r.f}</td><td class="n">${pct(r.a,r.f)}</td></tr>`).join("")}</table>
   <h2>Players</h2>
   <table><tr><th>Player</th><th>Rating</th><th>Hands tried</th><th>Agreed (first try)</th><th>Answers</th><th>Express best</th><th>Daily 5s</th><th>Skills mastered</th><th>Flags</th></tr>
   ${players.map(p=>`<tr><td>${esc(p.u.username)}${p.u.role==="expert"?'<span class="tag">expert</span>':""}</td><td class="n">${p.u.rating??""}</td><td class="n">${p.first} / ${ITEMS.length}</td><td class="n">${pct(p.agree,p.first)}</td><td class="n">${p.total}</td><td class="n">${p.exBest??""}</td><td class="n">${p.daily||""}</td><td class="n">${p.mastered} / ${SKILLS.length}</td><td class="n">${p.flags||""}</td></tr>`).join("")}</table>
   <h2>Hands</h2><p class="note">Sorted with the hands experts agree with least at the top. A hand experts keep disagreeing with is the first to recheck.</p>
   <table><tr><th>Hand</th><th>Drill answer</th><th>Source</th><th>Tried</th><th>Agreed</th><th>Experts agreed</th>${BANDS.map(b=>`<th>${b[0]}</th>`).join("")}<th>Flags</th></tr>
   ${qrows.map(r=>`<tr><td>${esc(qtxt(r.i))}<br><span class="note">${esc(r.i.rule)}</span></td><td>${esc(r.i.answer)}</td><td>${esc(r.i.source==="Rule"?"Built from rule":r.i.source)}</td><td class="n">${r.n}</td><td class="n${r.n&&r.ok/r.n<.5?" lo":""}">${pct(r.ok,r.n)}</td><td class="n${r.en&&r.eok/r.en<.5?" lo":""}">${r.en?`${r.eok}/${r.en}`:"–"}</td>${BANDS.map(b=>{const[x,y]=r.byBand[b[0]];return `<td class="n">${y?`${x}/${y}`:"–"}</td>`}).join("")}<td class="n">${r.fl||""}</td></tr>`).join("")}</table>`;
  $("out").onclick=()=>A.signOut(auth);
  $("copy").onclick=async()=>{const t=["Euchre drill flags ("+fl.length+")",""].concat(fl.map((f,n)=>`${n+1}. [${f.qid}] ${FT[f.type]} · ${f.u.username||f.username}${f.u.role==="expert"?" (expert)":""}${f.u.rating?" "+f.u.rating:""}\n   ${qtxt(f.i)} · prompt: ${f.i.prompt||"(bidding)"}\n   Drill: ${f.i.answer} (${f.i.source}) · they picked: ${f.picked||"-"}\n   Rule: ${f.i.rule}\n   Comment: ${f.note||"(none)"}\n`)).join("\n");

}
</script>
